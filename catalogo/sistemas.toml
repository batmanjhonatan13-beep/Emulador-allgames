# Consoles e emuladores, no estilo do ArkOS/R36S.
#
# Cada [[sistema]] é uma pasta em ~/AllGames/roms/<pasta>. Toda ROM colocada lá
# aparece sozinha no portal, com capa, e abre no emulador do sistema. As pastas
# usam os mesmos nomes do ArkOS: dá para copiar a pasta "roms" do cartão do R36S
# inteira (com a "bios" junto) para ~/AllGames/roms.
#
# Sistema:
#   id          pasta principal em ~/AllGames/roms (nome do ArkOS)
#   pastas      outros nomes aceitos para a mesma pasta (ex.: "megadrive")
#   nome        nome mostrado no portal
#   extensoes   extensões de ROM reconhecidas
#   emulador    chave de [emulador.<chave>]
#   core        core do RetroArch (só para emulador = "retroarch")
#   libretro    pasta do acervo libretro-thumbnails, para as capas
#   bios        arquivos de BIOS do SEU console, em ~/AllGames/roms/bios
#   controles   como padrão "controle"; "toque" se der para jogar tocando
#
# Emulador:
#   flatpak     app do Flathub instalado por `allgames emuladores instalar`
#   appimage    em vez de flatpak: você coloca o AppImage em
#               ~/AllGames/emuladores/<chave>/ (usado quando não há versão no Flathub)
#   comando     como abrir uma ROM. Marcadores: {emulador} (o comando do app),
#               {rom}, {pasta_rom}, {roms}, {bios}, {core}, {retroarch_cfg}
#   saves       onde o emulador grava o progresso (vai para as cópias de segurança).
#               Marcadores: {pasta_rom}, {nome} (nome da ROM sem extensão)
#   alternativas  comando diferente quando o nome do AppImage contém a palavra
#   aviso       observação mostrada no portal e em `allgames emuladores`
#
# Nada aqui baixa ROMs, BIOS, chaves ou firmware: você usa os do seu console.

# ------------------------------------------------------------------ emuladores

[emulador.retroarch]
nome = "RetroArch"
flatpak = "org.libretro.RetroArch"
# Os saves ficam ao lado da ROM, como no ArkOS (ao copiar o cartão do R36S os
# saves .srm vêm junto) e a BIOS vem de ~/AllGames/roms/bios.
comando = ["{emulador}", "-f", "-L", "{core}", "--appendconfig", "{retroarch_cfg}", "{rom}"]
saves = ["{pasta_rom}/{nome}.srm", "{pasta_rom}/{nome}.state*", "{pasta_rom}/{nome}.sav"]

[emulador.melonds]
nome = "melonDS"
flatpak = "net.kuribo64.melonDS"
comando = ["{emulador}", "--fullscreen", "{rom}"]
saves = ["{pasta_rom}/{nome}.sav", "{pasta_rom}/{nome}.ml[0-9]"]

[emulador.ppsspp]
nome = "PPSSPP"
flatpak = "org.ppsspp.PPSSPP"
comando = ["{emulador}", "--fullscreen", "{rom}"]
saves = ["~/.var/app/org.ppsspp.PPSSPP/config/ppsspp/PSP/SAVEDATA/**/*"]

[emulador.pcsx2]
nome = "PCSX2"
flatpak = "net.pcsx2.PCSX2"
comando = ["{emulador}", "-fullscreen", "-batch", "--", "{rom}"]
saves = ["~/.var/app/net.pcsx2.PCSX2/config/PCSX2/memcards/*"]
aviso = "Na primeira vez, o PCSX2 pede a pasta da BIOS do seu PS2: escolha ~/AllGames/roms/bios."

[emulador.dolphin]
nome = "Dolphin"
flatpak = "org.DolphinEmu.dolphin-emu"
comando = ["{emulador}", "--batch", "--config=Dolphin.Display.Fullscreen=True", "--exec={rom}"]
saves = [
  "~/.var/app/org.DolphinEmu.dolphin-emu/data/dolphin-emu/GC/**/*",
  "~/.var/app/org.DolphinEmu.dolphin-emu/data/dolphin-emu/Wii/title/**/data/*",
]

[emulador.azahar]
nome = "Azahar"
flatpak = "org.azahar_emu.Azahar"
comando = ["{emulador}", "-f", "{rom}"]
saves = ["~/.var/app/org.azahar_emu.Azahar/data/azahar-emu/sdmc/Nintendo 3DS/*/*/title/*/*/data/**/*"]

[emulador.xemu]
nome = "xemu"
flatpak = "app.xemu.xemu"
comando = ["{emulador}", "-full-screen", "-dvd_path", "{rom}"]
aviso = "Na primeira vez, configure no xemu a BIOS, o boot ROM (MCPX) e o HD do seu Xbox, em ~/AllGames/roms/bios/xbox. Os saves ficam dentro do HD virtual (xbox_hdd.qcow2): copie esse arquivo para guardar."

[emulador.switch]
nome = "Emulador de Switch (Eden, Citron ou Ryujinx)"
appimage = "switch"
comando = ["{emulador}", "-f", "-g", "{rom}"]
# Se o nome do AppImage tiver uma destas palavras, usa o comando correspondente.
alternativas = { ryujinx = ["{emulador}", "--fullscreen", "{rom}"], ryubing = ["{emulador}", "--fullscreen", "{rom}"] }
aviso = "Baixe o AppImage do emulador no site oficial dele e coloque em ~/AllGames/emuladores/switch/. Ele precisa das chaves (prod.keys) e do firmware tirados do SEU Switch."

[emulador.xenia]
nome = "Xenia Canary (Xbox 360, experimental no Linux)"
appimage = "xenia"
comando = ["{emulador}", "--fullscreen", "{rom}"]
aviso = "A versão Linux do Xenia ainda é experimental: muitos jogos não abrem. Coloque o AppImage em ~/AllGames/emuladores/xenia/."

