# Catálogo de jogos do AllGames.
#
# Cada [[jogo]] vira um "app" no Sunshine e aparece no Moonlight do celular
# depois de `allgames instalar <id>` e `allgames sincronizar`.
#
# Campos:
#   id          identificador curto; precisa existir receitas/<id>.sh
#   nome        nome que aparece no celular
#   plataforma  console original
#   tipo        "port"      -> port nativo para PC feito a partir da descompilação
#               "recomp"    -> recompilação estática do binário original
#               "emulador"  -> descompilação só "matching" (gera a ROM igual à
#                              original), então o jogo roda em emulador
#   decomp      repositório da descompilação (da lista SamidyFR/Game-Decompilations)
#   projeto     repositório usado de fato para gerar o executável
#   capa        "Sistema/Nome" do acervo libretro-thumbnails (opcional);
#               um PNG em capas/<id>.png tem prioridade
#   originais   arquivos do SEU jogo original que precisam estar em
#               ~/AllGames/originais. `arquivo` aceita curingas (*) e não
#               diferencia maiúsculas. `sha1` (opcional) lista os hashes aceitos.
#               `opcional = true` quando o jogo roda sem eles (ex.: demo).
#
# Nada aqui baixa ROMs ou dados de jogos: você fornece a cópia que já tem.

[[jogo]]
id = "sm64"
nome = "Super Mario 64"
plataforma = "Nintendo 64"
tipo = "port"
decomp = "https://github.com/n64decomp/sm64"
projeto = "https://github.com/sm64pc/sm64ex"
capa = "Nintendo - Nintendo 64/Super Mario 64 (USA)"
originais = [
  { arquivo = "sm64.us.z64", descricao = "ROM americana (.z64) do seu cartucho", sha1 = ["9bef1128717f958171a4afac3ed78ee2bb4e86ce"] },
]

