# Catálogo de jogos do AllGames.
#
# Cada [[jogo]] aparece no portal (a tela com capas) e vira um app no Sunshine
# depois de `allgames instalar <id>`.
#
# Campos:
#   id          identificador curto
#   nome        nome que aparece no celular
#   plataforma  console original
#   tipo        "port"      -> port nativo para PC feito a partir da descompilação
#               "recomp"    -> recompilação estática do binário original
#               "emulador"  -> descompilação só "matching" (gera a ROM igual à
#                              original), então o jogo roda em emulador
#               "pc"        -> versão de PC do jogo (Steam/Proton)
#   receita     receitas/<receita>.sh; sem o campo, usa receitas/<id>.sh
#   colecao     agrupa os jogos em fileiras no portal (ex.: "Pokémon")
#   descricao   texto curto mostrado no portal
#   controles   "controle" (precisa de controle: Bluetooth ou o virtual do
#               Moonlight) e/ou "toque" (dá para jogar tocando na tela)
#   saves       onde o jogo grava o progresso no PC: caminhos relativos à pasta
#               do jogo (~/AllGames/jogos/<id>) ou começando com "~/".
#               Aceita curingas (* e **). É o que `allgames saves` mostra e o
#               que vai para as cópias de segurança.
#   decomp      repositório da descompilação (lista SamidyFR/Game-Decompilations)
#   projeto     repositório usado de fato para rodar o jogo
#   capa        "Sistema/Nome" do acervo libretro-thumbnails (opcional);
#               um PNG em capas/<id>.png tem prioridade
#   originais   arquivos do SEU jogo original em ~/AllGames/originais.
#               `arquivo` aceita curingas e alternativas ("*.gb|*.gbc") e não
#               diferencia maiúsculas. Com `sha1`, o arquivo é reconhecido pelo
#               conteúdo, então o nome não importa. `opcional = true` quando o
#               jogo roda sem ele (ex.: demo).
#
# [receita.<nome>] define valores padrão para todos os jogos daquela receita.
# Nada aqui baixa ROMs ou dados de jogos: você fornece a cópia que já tem.

[receita.mgba]
tipo = "emulador"
colecao = "Pokémon"
projeto = "https://github.com/mgba-emu/mgba"
controles = ["controle"]
saves = ["*.sav", "*.ss[0-9]"]

[receita.melonds]
tipo = "emulador"
colecao = "Pokémon"
projeto = "https://github.com/melonDS-emu/melonDS"
controles = ["controle"]
saves = ["*.sav", "*.ml[0-9]"]

