# ------------------------------------------------------------------ Resident Evil
# A descompilação do RE4 na lista (adonis-singh/re4) é "matching" do protótipo
# de debug de 2004 do GameCube: ela reconstrói os mesmos arquivos do disco, não
# um port. Então o RE4 roda com o seu disco no Dolphin ou pela versão da Steam.

[[jogo]]
id = "re4"
nome = "Resident Evil 4"
plataforma = "GameCube"
tipo = "emulador"
colecao = "Resident Evil"
descricao = "Leon vai à Espanha resgatar a filha do presidente. Os dois discos trocam sozinhos."
decomp = "https://github.com/adonis-singh/re4"
projeto = "https://github.com/dolphin-emu/dolphin"
capa = "Nintendo - GameCube/Resident Evil 4 (USA) (Disc 1)"
saves = [
  "~/.var/app/org.DolphinEmu.dolphin-emu/data/dolphin-emu/GC/*/Card A/*G4BE*",
  "~/.var/app/org.DolphinEmu.dolphin-emu/data/dolphin-emu/GC/MemoryCardA.*.raw",
]
originais = [
  { arquivo = "re4-disco1.*", descricao = "dump do disco 1 (.iso, .rvz, .gcm ou .ciso)" },
  { arquivo = "re4-disco2.*", descricao = "dump do disco 2 (.iso, .rvz, .gcm ou .ciso)" },
]

[[jogo]]
