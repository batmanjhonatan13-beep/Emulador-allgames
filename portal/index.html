<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AllGames</title>
  <link rel="stylesheet" href="/estilo.css">
</head>
<body>
  <header class="topo">
    <div class="marca">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="3" width="11" height="11" rx="3"/><rect x="18" y="3" width="11" height="11" rx="3" opacity=".55"/><rect x="3" y="18" width="11" height="11" rx="3" opacity=".55"/><rect x="18" y="18" width="11" height="11" rx="3"/></svg>
      <span>AllGames</span>
    </div>
    <nav class="abas">
      <button class="aba ativa" data-nav data-aba="inicio">Início</button>
      <button class="aba" data-nav data-aba="recentes">Recentes</button>
      <button class="aba" data-nav data-aba="instalados">Instalados</button>
      <button class="aba" data-nav data-aba="biblioteca">Biblioteca</button>
      <button class="aba" data-nav data-aba="downloads">Downloads <span id="contagem-downloads" class="emblema" hidden></span></button>
    </nav>
    <div class="status">
      <button id="abrir-steam" class="pilula botao-steam" data-nav aria-label="Abrir a Steam">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="15.5" cy="9" r="2.5"/><path d="M3.5 14.5l5.5 2.3a2.6 2.6 0 0 0 5-1.3l1.2-4"/></svg>
        Steam
      </button>
      <span id="entrada" class="pilula"></span>
      <span id="relogio" class="relogio"></span>
      <button id="sair" class="botao-icone" data-nav hidden aria-label="Sair do AllGames">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v9M6.3 6.3a8 8 0 1 0 11.4 0"/></svg>
      </button>
    </div>
  </header>

  <main>
    <section id="inicio" class="visao">
      <div id="destaque" class="destaque"></div>
      <div id="fileiras"></div>
    </section>
    <section id="recentes" class="visao" hidden>
      <div id="grade-recentes" class="grade"></div>
    </section>
    <section id="instalados" class="visao" hidden>
      <div id="instalando"></div>
      <h2 class="titulo-secao">Prontos para jogar</h2>
      <div id="grade-instalados" class="grade"></div>
    </section>
    <section id="biblioteca" class="visao" hidden>
      <div class="barra-busca">
        <input id="busca" type="search" placeholder="Buscar jogo…" autocomplete="off" data-nav>
      </div>
      <div id="filtros" class="filtros"></div>
      <div id="grade" class="grade"></div>
    </section>
    <section id="downloads" class="visao" hidden>
      <h2 class="titulo-secao">Espaço em disco</h2>
      <div id="discos" class="discos"></div>
      <h2 class="titulo-secao">Downloads</h2>
      <div id="lista-downloads" class="lista-downloads"></div>
    </section>
  </main>

  <div id="detalhe" class="camada" hidden></div>
  <div id="aviso" class="camada" hidden></div>
  <div id="teclado" class="camada" hidden></div>
  <div id="jogando" class="camada camada-jogando" hidden></div>
  <div id="mensagem" class="mensagem" hidden></div>

  <footer id="dica" class="dica" hidden>
    <span><b class="tecla a">A</b> Selecionar</span>
    <span><b class="tecla b">B</b> Voltar</span>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
